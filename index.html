<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>
        <p id="display">0</p>
        <div>
            <button class="number small">1</button>
            <button class="number small">2</button>
            <button class="number small">3</button>
            <button class="big" id="delete">DEL</button>
            <button class="big" id="clear">AC</button>
        </div>
        <div>
            <button class="number small">4</button>
            <button class="number small">5</button>
            <button class="number small">6</button>
            <button class="operator big">*</button>
            <button class="operator big">/</button>
        </div>
        <div>
            <button class="number small">7</button>
            <button class="number small">8</button>
            <button class="number small">9</button>
            <button class="operator big">+</button>
            <button class="operator big">-</button>
        </div>
        <div>
            <button class="small" id="decimal">.</button>
            <button class="number small">0</button>
            <button class="number small">00</button>
            <button class="big" id="equal">=</button>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
